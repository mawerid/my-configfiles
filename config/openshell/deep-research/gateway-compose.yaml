services:
  gateway:
    image: &gateway-image ghcr.io/nvidia/openshell/gateway:latest
    depends_on:
      init:
        condition: service_completed_successfully
    command: []
    user: "0"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OPENSHELL_GATEWAY_CONFIG: /etc/openshell/gateway.toml
      OPENSHELL_DB_URL: "sqlite:/var/lib/deep-research-gateway-state/gateway.db?mode=rwc"
      XDG_DATA_HOME: "${DEEP_RESEARCH_GATEWAY_DATA}"
      HOME: "${DEEP_RESEARCH_GATEWAY_DATA}"
    volumes:
      - "${DEEP_RESEARCH_GATEWAY_DATA:?Set an absolute gateway data directory}:${DEEP_RESEARCH_GATEWAY_DATA}"
      - gateway-database:/var/lib/deep-research-gateway-state
      - /var/run/docker.sock:/var/run/docker.sock
      - ./gateway.toml:/etc/openshell/gateway.toml:ro
  init:
    image: *gateway-image
    user: "0"
    command: ["generate-certs", "--output-dir", "/var/lib/deep-research-gateway-state/tls"]
    volumes:
      - gateway-database:/var/lib/deep-research-gateway-state
volumes:
  gateway-database:
