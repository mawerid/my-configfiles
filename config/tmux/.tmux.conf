# ----- general -----
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -sg escape-time 0
set -g repeat-time 300

set -g mouse on
set -g history-limit 100000
setw -g mode-keys vi
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# for agents
set -gq allow-passthrough on
set -s extended-keys on
set -s 'terminal-features[100]' 'xterm*:extkeys'

# terminal
set -g default-terminal "tmux-256color"
set -s 'terminal-features[101]' 'xterm-256color:RGB'

# split in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# reload config
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# new window in current path
bind c new-window -c "#{pane_current_path}"

# copy-mode like vim
set -s set-clipboard external
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# status
set -g status-position bottom
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#S "
set -g status-right "#{pane_current_path} | %Y-%m-%d %H:%M"

# ----- plugins -----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
# Without a system clipboard command, let tmux handle the clipboard via OSC 52.
set -g @custom_copy_command ':'

if-shell 'test -x "$HOME/.tmux/plugins/tpm/tpm"' 'run-shell ~/.tmux/plugins/tpm/tpm'
